name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME}" = "v$(bun -e "console.log(require('./package.json').version)")"
      - run: bun run check
      - run: bun test
      - name: Smoke-test LibreOffice rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-core libreoffice-calc
          XLSX_RENDERER=libreoffice bun src/cli.ts render tests/fixtures/generated/21-text-csv-escaping.xlsx --out /tmp/xlsx-render-smoke --pages 1
          test -s /tmp/xlsx-render-smoke/page-001.png
      - run: bun run build:npm
      - run: npm pack --dry-run

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # IronCalc is a native dependency, so each binary is built on its own
          # architecture; cross-compiling would bundle the runner's .node binding.
          - { os: ubuntu-latest, target: bun-linux-x64, name: xlsx-linux-x64 }
          - { os: ubuntu-24.04-arm, target: bun-linux-arm64, name: xlsx-linux-arm64 }
          - { os: macos-15-intel, target: bun-darwin-x64, name: xlsx-darwin-x64 }
          - { os: macos-14, target: bun-darwin-arm64, name: xlsx-darwin-arm64 }
          - { os: windows-latest, target: bun-windows-x64, name: xlsx-windows-x64.exe }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Compile
        run: bun build --compile --minify --target=${{ matrix.target }} --outfile=${{ matrix.name }} src/cli.ts
      - name: Smoke test
        shell: bash
        run: |
          chmod +x "${{ matrix.name }}"
          ./${{ matrix.name }} --version
          ./${{ matrix.name }} read tests/fixtures/generated/22-formulas-without-cache.xlsx | grep -F '3,6,3,,87'
          ./${{ matrix.name }} read tests/fixtures/generated/22-formulas-without-cache.xlsx --values raw | grep -F '=A2*2'
          ./${{ matrix.name }} list tests/fixtures/generated/25-hidden-and-very-hidden.xlsx | grep -F '"Very Hidden"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Stage release files and checksums
        run: |
          cp LICENSE NOTICES install.sh artifacts/
          cd artifacts
          sha256sum xlsx-* install.sh > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    environment: Publishing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - name: Publish with npm trusted publishing
        run: npm publish --access public
